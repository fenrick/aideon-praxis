name: Pipeline

on:
  push:
  pull_request:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      # Frontend (OS-independent)
      - run: pnpm run node:format:check
      - run: pnpm run node:lint
      - run: pnpm run node:typecheck
      - run: pnpm run node:test

      # Rust — Tauri needs GTK/WebKit to compile on Linux
      - name: Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - run: pnpm run host:format:check
      - run: pnpm run host:lint
      - run: pnpm run host:check
      - run: pnpm run host:test

  build:
    name: Tauri Build (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('src-tauri/Cargo.toml', 'pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-tauri-

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm tauri build --ci

  e2e:
    name: WebDriver E2E
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Linux GUI deps + WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            webkit2gtk-driver xvfb

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile

      - name: WebDriver tests
        run: pnpm run webdriver:test:headless
