# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: ['main']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ['main']
  schedule:
    - cron: '38 17 * * 4'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      # Pinned to v1.1.0: v4.x added run-docker-tools (default true) which runs
      # EVERY dockerized analyzer locally regardless of the tools disabled in the
      # Codacy project — flooding code scanning with ~2k style findings and making
      # the job very slow. v1.x honours the project-token configuration (runs only
      # the enabled tools). (This deliberately holds back dependabot bump #798.)
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # The Codacy CLI runs every dockerised analyzer regardless of the tools
      # disabled in the Codacy project (run-docker-tools defaults to true and
      # run-docker-tools:false produces no SARIF at all). It also emits one run
      # per tool with no category, and GitHub code scanning both (a) rejects
      # multiple runs sharing a category (upload-sarif@v4, 2025-07-21 change) and
      # (b) caps a SARIF file at 20 runs. So prepare the SARIF here:
      #   1. Drop runs from analyzers this repo does not use — its gates are
      #      ESLint + Prettier + Tailwind + clippy, not these style/JS linters.
      #      (These are also disabled in the Codacy UI; the CLI ignores that.)
      #   2. Drop empty (no-finding) runs; keep findings-bearing runs first.
      #   3. Cap at 20 runs (warn, never silently drop, if findings exceed 20).
      #   4. Give each surviving run a STABLE category (automationDetails.id) —
      #      the tool name, not a positional index, so GitHub keeps each tool's
      #      alert history across runs (an index shifts when a tool flips between
      #      clean and findings, which would reset that tool's alert stream).
      - name: Prepare SARIF for code scanning
        env:
          # Analyzers this repo does not adopt (its gates are ESLint + Prettier +
          # Tailwind + clippy). Matched as whole words, case-insensitively,
          # against the SARIF tool driver name. Security/IaC tools (Trivy,
          # Checkov, Semgrep) and everything else are kept.
          EXCLUDED_ANALYZERS: 'csslint|stylelint|jshint|biome|remark|pmd'
        run: |
          # Guard: if no analyzer produced output, emit a valid empty SARIF.
          [ -f results.sarif ] || echo '{"version":"2.1.0","runs":[]}' > results.sarif
          deny="\\b(${EXCLUDED_ANALYZERS})\\b"
          kept=$(jq --arg deny "$deny" '[.runs[] | select(((.tool.driver.name // "") | ascii_downcase | test($deny)) | not) | select(((.results // []) | length) > 0)] | length' results.sarif)
          if [ "$kept" -gt 20 ]; then
            echo "::warning::${kept} kept SARIF runs have findings but GitHub allows 20 per file; lower-priority runs will be omitted."
          fi
          jq --arg deny "$deny" '
            def slug: ascii_downcase | gsub("[^a-z0-9]+"; "-");
            # Runs from adopted tools, in the original (deterministic) order.
            ([.runs[] | select(((.tool.driver.name // "") | ascii_downcase | test($deny)) | not)]) as $wanted
            # Stable, unique category per run: slug(tool) plus a per-tool occurrence
            # index in original order (handles duplicate/missing tool names without
            # depending on findings, so a tool keeps its category across runs).
            | (reduce range(0; ($wanted | length)) as $i ({ c: {}, out: [] };
                 ($wanted[$i].tool.driver.name // "codacy" | slug) as $s
                 | (.c[$s] // 0) as $n
                 | .c[$s] = ($n + 1)
                 | .out += [ $wanted[$i] * { automationDetails: { id: ($s + "-" + ($n | tostring) + "/") } } ]
               ) | .out) as $tagged
            # Cap at the GitHub 20-run-per-file limit, findings-bearing runs first.
            | .runs = ( [$tagged[] | select(((.results // []) | length) > 0)]
                      + [$tagged[] | select(((.results // []) | length) == 0)] )[0:20]
          ' results.sarif > results.prepared.sarif
          mv results.prepared.sarif results.sarif
          echo "SARIF runs after preparation: $(jq '.runs | length' results.sarif)"
          jq -r '"Tools kept: " + ([.runs[].tool.driver.name // "codacy"] | unique | join(","))' results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
