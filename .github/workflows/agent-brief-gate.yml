name: Agent Brief Gate

# Validates that issues labeled `ready-for-agent` satisfy the agent-task contract
# (docs/build-contracts/agent-issue-template.md). On failure: posts a comment
# listing missing sections, removes `ready-for-agent`, and applies `needs-info`.
# On success: posts a ✓ comment confirming structural validity.
#
# workflow_dispatch provides a dry-run mode for testing without mutating labels.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to validate
        required: true
        type: number
      dry_run:
        description: 'Dry run — validate only, no label changes or comments'
        required: false
        default: 'true'
        type: boolean

permissions:
  issues: write

jobs:
  validate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const { validateAgentBrief } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/validate-agent-brief.mjs`
            );

            const isDryRun =
              context.eventName === 'workflow_dispatch'
                ? String(context.payload.inputs?.dry_run) === 'true'
                : false;

            let issueNumber;
            let issueBody;

            if (context.eventName === 'workflow_dispatch') {
              issueNumber = Number(context.payload.inputs.issue_number);
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issueBody = data.body ?? '';
            } else {
              issueNumber = context.payload.issue.number;
              issueBody = context.payload.issue.body ?? '';
            }

            const { valid, missing } = validateAgentBrief(issueBody);

            if (!valid) {
              const comment = [
                '> *This was generated by AI during triage.*',
                '',
                '## ❌ Agent Brief Gate: validation failed',
                '',
                `The \`ready-for-agent\` label was applied to #${issueNumber}, but the following required sections are missing or empty:`,
                '',
                ...missing.map((m) => `- **${m}**`),
                '',
                'Complete the missing sections using the [agent-issue-template](../blob/main/docs/build-contracts/agent-issue-template.md) (or the [agent task form](../issues/new?template=agent_task.yml)), then re-apply the `ready-for-agent` label.',
                '',
                '> An issue is agent-ready only when an agent can complete it **from the issue alone** — named authoritative sources, concrete acceptance scenarios, and no open design questions.',
              ].join('\n');

              if (isDryRun) {
                core.info('[dry-run] Would post failure comment:');
                core.info(comment);
                core.info('[dry-run] Would remove ready-for-agent and apply needs-info.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: comment,
                });

                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: 'ready-for-agent',
                  });
                } catch (err) {
                  core.warning(`Could not remove ready-for-agent: ${err.message}`);
                }

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['needs-info'],
                });
              }

              core.setFailed(
                `Agent brief validation failed — missing: ${missing.join('; ')}`,
              );
            } else {
              const comment = [
                '> *This was generated by AI during triage.*',
                '',
                '✓ Agent brief validated — all required sections are present. This issue is structurally ready for an agent.',
              ].join('\n');

              if (isDryRun) {
                core.info('[dry-run] Would post success comment:');
                core.info(comment);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: comment,
                });
              }
            }
