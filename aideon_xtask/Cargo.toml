[package]
name = "aideon_xtask"
version.workspace = true
edition = "2024"

[dependencies]
aideon_continuum = { path = "../crates/continuum" }
aideon_praxis = { path = "../crates/praxis" }
aideon_mneme = { path = "../crates/mneme" }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27"
