[package]
name = "aideon_praxis"
version.workspace = true
edition = "2024"
authors = ["Aideon Praxis Contributors"]
license = "MIT"

[dependencies]
aideon_mneme_core = { path = "../mneme_core" }
async-recursion = "1.1.1"
async-trait = "0.1.89"
blake3 = "1.8.5"
# `bundled` compiles SQLite from source so we don't depend on a system
# `sqlite3.lib`/`libsqlite3` — the Windows runner has none (LNK1181) and it
# keeps macOS/Linux builds reproducible too.
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
serde_yaml = "0.9.34"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
tokio = { version = "1.52.3", features = ["sync", "rt"] }
futures = "0.3.32"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
