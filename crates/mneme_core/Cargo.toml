[package]
name = "aideon_mneme_core"
version.workspace = true
edition = "2024"
authors = ["Aideon Mneme Contributors"]
license = "MIT"

[lib]
name = "mneme_core"

[dependencies]
blake3 = "1.8.5"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["parsing"] }
uuid = { version = "1.23.4", features = ["v4", "v5", "serde"] }

[dev-dependencies]
serde_json = "1.0.150"
