[package]
name = "aideon_mneme_store"
version.workspace = true
edition = "2024"
authors = ["Aideon Mneme Contributors"]
license = "MIT"

[lib]
name = "mneme_store"

[dependencies]
aideon_mneme_core = { path = "../mneme_core" }
blake3 = "1.8.5"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting"] }
uuid = { version = "1.23.3", features = ["v4", "v5", "serde"] }
# `bundled` compiles SQLite from source so there is no dependency on a system
# `sqlite3.lib`/`libsqlite3` (the Windows runner has none — LNK1181 — and it
# keeps macOS/Linux builds reproducible).
rusqlite = { version = "0.40.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27"
