[package]
name = "aideon_mneme_store"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
aideon_mneme_core = { path = "../mneme_core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
async-trait = "0.1.89"
sea-orm = { version = "2.0.0-rc.40", features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "sqlx-postgres",
  "sqlx-mysql",
] }
sea-orm-migration = { version = "2.0.0-rc.40", features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "sqlx-postgres",
  "sqlx-mysql",
] }
blake3 = "1.8.5"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
unicode-normalization = "0.1.25"
log = "0.4.32"
base64 = "0.22.1"
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
