[package]
name = "aideon_desktop"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aideon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-log = "2.9"
tauri-plugin-dialog = "2.7.1"
window-vibrancy = { version = "0.7.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.0", features = ["fs", "macros", "rt", "time"] }
log = "0.4.33"
serde_json = "1.0.150"
dirs = "6.0"
uuid = { version = "1.24.0", features = ["v4"] }
once_cell = "1.21.4"
aideon_praxis = { path = "../crates/praxis" }
aideon_chrona = { path = "../crates/chrona" }
aideon_continuum = { path = "../crates/continuum" }
aideon_engine = { path = "../crates/engine" }
time = { version = "0.3.53", features = ["formatting"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = { version = "0.7.1" }

[dev-dependencies]
tempfile = "3.27"
tauri = { version = "2.11.5", features = ["test"] }
regex = "1.13.1"
toml = "1.1.3"
logtest = "2.0"
serial_test = "3"
