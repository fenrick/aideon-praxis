[package]
name = "aideon_desktop"
version.workspace = true
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aideon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-log = "2.8"
tauri-plugin-dialog = "2.7.1"
window-vibrancy = { version = "0.7.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["fs", "macros", "rt", "time"] }
log = "0.4.32"
serde_json = "1.0.150"
dirs = "6.0"
uuid = { version = "1.23.3", features = ["v4"] }
once_cell = "1.21.4"
aideon_praxis = { path = "../crates/praxis" }
aideon_chrona = { path = "../crates/chrona" }
aideon_continuum = { path = "../crates/continuum" }
time = { version = "0.3.47", features = ["formatting"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = { version = "0.7.1" }

[dev-dependencies]
tempfile = "3.27"
tauri = { version = "2.11.2", features = ["test"] }
regex = "1.12.4"
toml = "1.1.2"
logtest = "2.0"
