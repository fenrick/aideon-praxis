# Read surface — granted to every window (least-privilege per window is refined
# further in the capabilities, but reads never mutate the twin). Mutating and
# accepted-work commands live in `appcommands-mutating` and are granted to the
# workspace-bearing `main` window only ([capabilities-and-csp], #318). The
# `appcommands_permission_matches_generated_surface` test enforces that read ∪
# mutating equals the generated command surface, with no overlap.
[[permission]]
identifier = "appcommands"
description = "Read-only Aideon Desktop IPC commands (granted to all windows)."
commands.allow = [
  "chrona_temporal_diff",
  "chrona_temporal_list_branches",
  "chrona_temporal_list_commits",
  "chrona_temporal_state_at",
  "chrona_temporal_topology_delta",
  "praxis_artefact_execute_catalogue",
  "praxis_artefact_execute_chart",
  "praxis_artefact_execute_graph",
  "praxis_artefact_execute_matrix",
  "praxis_canvas_get_layout",
  "praxis_canvas_get_scene",
  "praxis_graph_layout_get",
  "praxis_metamodel_get",
  "praxis_scenario_list",
  "system_logging_context",
  "system_metrics_snapshot",
  "system_setup_state",
  "system_window_open",
  "system_worker_health",
  "workspace_diff",
  "workspace_metamodel_types",
  "workspace_nodes",
  "workspace_projects_list",
  "workspace_state_at",
  "workspace_status",
  "workspace_templates_list",
]
