# Generated surface mirror (ADR-0039): this allowlist must equal the command set
# generated into `src/adapters/ipc-bindings.gen.ts` from the Rust commands. The
# `appcommands_permission_matches_generated_surface` test enforces the equality;
# change this list only by adding/removing a `#[tauri::command]` in the builder.
[[permission]]
identifier = "appcommands"
description = "Allow Aideon Desktop application IPC commands."
commands.allow = [
  "chrona_temporal_commit_changes",
  "chrona_temporal_create_branch",
  "chrona_temporal_diff",
  "chrona_temporal_list_branches",
  "chrona_temporal_list_commits",
  "chrona_temporal_merge_branches",
  "chrona_temporal_state_at",
  "chrona_temporal_topology_delta",
  "praxis_artefact_execute_catalogue",
  "praxis_artefact_execute_chart",
  "praxis_artefact_execute_graph",
  "praxis_artefact_execute_matrix",
  "praxis_canvas_get_layout",
  "praxis_canvas_get_scene",
  "praxis_canvas_save_layout",
  "praxis_graph_layout_get",
  "praxis_graph_layout_save",
  "praxis_metamodel_get",
  "praxis_scenario_list",
  "praxis_task_apply_operations",
  "system_logging_context",
  "system_metrics_snapshot",
  "system_setup_complete",
  "system_setup_state",
  "system_window_open",
  "system_worker_health",
  "workspace_close",
  "workspace_create",
  "workspace_open",
  "workspace_projects_list",
  "workspace_rebuild",
  "workspace_status",
  "workspace_templates_list",
  "workspace_templates_save",
]
